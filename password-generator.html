    <link rel="stylesheet" href="styles.css">
    <style>
        .tool-container { max-width: 600px; margin: 100px auto; padding: 2rem; background: #fff; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.1); text-align: center; }
        .password-display { background: #f0f2f5; padding: 1.5rem; border-radius: 10px; font-family: monospace; font-size: 1.5rem; margin-bottom: 1rem; word-break: break-all; position: relative; }
        .copy-btn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: #4ecdc4; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 0.8rem; }
        .settings { text-align: left; margin: 2rem 0; }
        .setting-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        input[type="number"] { width: 60px; padding: 5px; }
        button#generateBtn { width: 100%; padding: 1rem; background: #ff6b6b; color: white; border: none; border-radius: 50px; cursor: pointer; font-weight: 600; font-size: 1.1rem; }
    </style>
</head>
<body>
    <header class="header">
        <nav class="nav">
            <div class="logo">ToolHub</div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="index.html#tools">Tools</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </div>
        </nav>
    </header>

    <main class="tool-container">
        <h2>Password Generator</h2>
        <p>Create highly secure, random passwords instantly.</p>
        
        <div class="password-display" id="passwordOutput">********
            <button class="copy-btn" onclick="copyPassword()">Copy</button>
        </div>

        <div class="settings">
            <div class="setting-item">
                <label for="length">Password Length</label>
                <input type="number" id="length" value="16" min="4" max="50">
            </div>
            <div class="setting-item">
                <label for="uppercase">Include Uppercase (A-Z)</label>
                <input type="checkbox" id="uppercase" checked>
            </div>
            <div class="setting-item">
                <label for="lowercase">Include Lowercase (a-z)</label>
                <input type="checkbox" id="lowercase" checked>
            </div>
            <div class="setting-item">
                <label for="numbers">Include Numbers (0-9)</label>
                <input type="checkbox" id="numbers" checked>
            </div>
            <div class="setting-item">
                <label for="symbols">Include Symbols (!@#$%^&*)</label>
                <input type="checkbox" id="symbols" checked>
            </div>
        </div>

        <button id="generateBtn" onclick="generatePassword()">Generate Password</button>
        <p id="status" style="margin-top:1rem;color:#27ae60;display:none;"></p>
    </main>

    <script>
        function generatePassword() {
            const length = document.getElementById('length').value;
            const hasUpper = document.getElementById('uppercase').checked;
            const hasLower = document.getElementById('lowercase').checked;
            const hasNumber = document.getElementById('numbers').checked;
            const hasSymbol = document.getElementById('symbols').checked;

            const upperChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const lowerChars = 'abcdefghijklmnopqrstuvwxyz';
            const numberChars = '0123456789';
            const symbolChars = '!@#$%^&*()_+~`|}{[]:;?><,./-=';

            let charSet = '';
            if (hasUpper) charSet += upperChars;
            if (hasLower) charSet += lowerChars;
            if (hasNumber) charSet += numberChars;
            if (hasSymbol) charSet += symbolChars;

            if (charSet === '') {
                alert('Please select at least one character type.');
                return;
            }

            let password = '';
            for (let i = 0; i < length; i++) {
                password += charSet.charAt(Math.floor(Math.random() * charSet.length));
            }

            document.getElementById('passwordOutput').firstChild.textContent = password;
        }

        function copyPassword() {
            const password = document.getElementById('passwordOutput').firstChild.textContent;
            if (password === '********') return;
            navigator.clipboard.writeText(password).then(() => {
                const status = document.getElementById('status');
                status.textContent = 'Password copied to clipboard!';
                status.style.display = 'block';
                setTimeout(() => status.style.display = 'none', 2000);
            });
        }
    </script>
    <script src="chatbot.js"></script>
    <div id="footer"></div>
    <script>
        fetch("./footer.html")
            .then(res => res.text())
            .then(data => document.getElementById("footer").innerHTML = data);
    </script>
</body>
