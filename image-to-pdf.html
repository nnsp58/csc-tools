<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Image to PDF Converter",
  "description": "Combine multiple images into single PDF. Reorder images and auto-scale to fit pages.",
  "url": "https://n-dizi.in/image-to-pdf.html",
  "applicationCategory": "UtilityApplication",
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "USD"
  },
  "operatingSystem": "All",
  "browserRequirements": "Modern browser with JavaScript enabled",
  "featureList": "Multi-image PDF, image reordering, auto-scaling, offline support"
}
</script>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="shortcut icon" href="favicon.png">
    <title>Image to PDF Converter - Combine & Reorder Images | ToolHub</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .tool-section { max-width: 1100px; margin: 100px auto; padding: 2.5rem; background: #fff; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        #img-upload { border: 2px dashed #00d4ff; padding: 3rem; text-align: center; border-radius: 15px; cursor: pointer; background: #faffff; transition: 0.3s; margin-bottom: 2rem; }
        #img-upload:hover { border-color: #008fb3; background: #f0ffff; }
        .file-list { margin-top: 2rem; display: grid; gap: 10px; }
        .file-item { display: flex; align-items: center; justify-content: space-between; padding: 15px; background: #f9f9f9; border-radius: 12px; border: 1px solid #eee; }
        .file-info { display: flex; align-items: center; gap: 15px; }
        .file-preview { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; }
        .reorder-btns { display: flex; gap: 5px; }
        .reorder-btns button { padding: 5px 12px; font-size: 0.8rem; background: #eee; color: #333; border-radius: 5px; }
        .reorder-btns button:hover { background: #ddd; }
        #convertBtn { display: block; width: 100%; max-width: 300px; margin: 2rem auto; }
        #result { text-align: center; margin-top: 2rem; padding: 2rem; border-top: 2px solid #eee; }
        .download-btn { display: inline-block; padding: 15px 40px; background: #28a745; color: white; border-radius: 50px; text-decoration: none; font-weight: 700; box-shadow: 0 4px 15px rgba(40,167,69,0.3); }
    </style>
</head>
<body>
    <header class="header">
        <nav class="nav">
            <div class="logo">ToolHub</div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="index.html#tools">Tools</a>
            </div>
        </nav>
    </header>

    <main id="main-content">
        <section class="tool-section">
            <h2>Image to PDF Converter</h2>
            <p>Combine multiple images into a single PDF. You can reorder images after uploading.</p>
            
            <div id="img-upload" onclick="document.getElementById('imgFiles').click()">
                <p>Click to upload or drag & drop images here</p>
                <input type="file" id="imgFiles" accept="image/*" multiple style="display:none">
            </div>

            <div id="file-list-container" class="file-list"></div>

            <button id="convertBtn" onclick="convertToPDF()">Convert to PDF</button>
            
            <div id="convStatus" style="text-align:center; font-weight:600; color:#1e3c72; margin-top:1rem;"></div>
            <div id="result"></div>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        const { jsPDF } = window.jspdf;
        let selectedFiles = [];

        const imgFilesInput = document.getElementById('imgFiles');
        const fileListContainer = document.getElementById('file-list-container');
        const statusEl = document.getElementById('convStatus');
        const resultEl = document.getElementById('result');

        imgFilesInput.addEventListener('change', e => {
            const files = Array.from(e.target.files);
            addFiles(files);
        });

        function addFiles(files) {
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    selectedFiles.push({
                        file: file,
                        id: Math.random().toString(36).substr(2, 9),
                        preview: e.target.result
                    });
                    renderFileList();
                };
                reader.readAsDataURL(file);
            });
        }

        function renderFileList() {
            fileListContainer.innerHTML = selectedFiles.map((item, index) => `
                <div class="file-item">
                    <div class="file-info">
                        <img src="${item.preview}" class="file-preview">
                        <span>${item.file.name}</span>
                    </div>
                    <div class="reorder-btns">
                        <button onclick="moveItem(${index}, -1)" ${index === 0 ? 'disabled' : ''}>Up</button>
                        <button onclick="moveItem(${index}, 1)" ${index === selectedFiles.length - 1 ? 'disabled' : ''}>Down</button>
                        <button onclick="removeItem(${index})" style="background:#ff6b6b; color:white;">Remove</button>
                    </div>
                </div>
            `).join('');
        }

        function moveItem(index, direction) {
            const target = index + direction;
            if (target >= 0 && target < selectedFiles.length) {
                const temp = selectedFiles[index];
                selectedFiles[index] = selectedFiles[target];
                selectedFiles[target] = temp;
                renderFileList();
            }
        }

        function removeItem(index) {
            selectedFiles.splice(index, 1);
            renderFileList();
        }

        async function convertToPDF() {
            if (!selectedFiles.length) {
                statusEl.textContent = 'Please select at least one image.';
                statusEl.style.color = 'red';
                return;
            }
            statusEl.style.color = '#1e3c72';
            resultEl.innerHTML = '';
            statusEl.textContent = 'Starting conversion...';

            try {
                const pdf = new jsPDF();
                let firstPage = true;

                for (let i = 0; i < selectedFiles.length; i++) {
                    const item = selectedFiles[i];
                    statusEl.textContent = `Processing image ${i+1}/${selectedFiles.length}...`;
                    const img = new Image();
                    img.src = item.preview; // Use the cached preview
                    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; });

                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);

                    const imgData = canvas.toDataURL('image/jpeg', 0.85);
                    if (!firstPage) pdf.addPage();
                    
                    const pw = pdf.internal.pageSize.getWidth();
                    const ph = pdf.internal.pageSize.getHeight();
                    const ratio = Math.min(pw / img.width, ph / img.height);
                    pdf.addImage(imgData, 'JPEG', 0, 0, img.width * ratio, img.height * ratio);
                    
                    firstPage = false;
                }

                const pdfBlob = pdf.output('blob');
                const url = URL.createObjectURL(pdfBlob);
                resultEl.innerHTML = `<a href="${url}" download="converted.pdf" class="download-btn">Download PDF</a>`;
                statusEl.textContent = 'Conversion complete!';
            } catch (error) {
                statusEl.textContent = 'Error: ' + error.message;
                statusEl.style.color = 'red';
            }
        }

        // Alias for tests
        function convertToPdf() { return convertToPDF(); }
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js').catch(err => console.log('SW failed:', err));
        }
    </script>
    <script src="chatbot.js"></script>
    <div id="footer"></div>
    <script>fetch("./footer.html").then(res => res.text()).then(data => document.getElementById("footer").innerHTML = data);</script>
</body>
</html>
