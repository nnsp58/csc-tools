<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passport Photo Maker - ToolHub</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .container { max-width: 900px; margin: 100px auto; padding: 2rem; background: #fff; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin: 1.5rem 0; }
        .upload-box { border: 2px dashed #1e3c72; padding: 2rem; text-align: center; border-radius: 15px; cursor: pointer; }
        #canvas { max-width: 100%; height: auto; border: 1px solid #ddd; margin-top: 1rem; display: none; }
        .btn-generate { width: 100%; padding: 1rem; background: #1e3c72; color: white; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; }
        .download-box { margin-top: 1rem; text-align: center; display: none; }
        .dl-btn { padding: 0.8rem 2rem; background: #28a745; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <header class="header">
        <nav class="nav">
            <div class="logo">ToolHub</div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="index.html#tools">Tools</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="container">
            <h2>Passport Size Photo Maker</h2>
            <p>Generate a professional passport photo sheet with multiple copies.</p>
            
            <div class="upload-box" onclick="document.getElementById('fileInput').click()">
                <p>Click to upload your portrait photo</p>
                <input type="file" id="fileInput" accept="image/*" style="display:none">
            </div>

            <div class="controls">
                <div>
                    <label>Background Color</label>
                    <input type="color" id="bgColor" value="#ffffff">
                </div>
                <div>
                    <label>Number of Copies</label>
                    <select id="copies">
                        <option value="4">4 Copies</option>
                        <option value="8" selected>8 Copies</option>
                        <option value="12">12 Copies</option>
                    </select>
                </div>
            </div>

            <button class="btn-generate" onclick="generateSheet()">Generate Photo Sheet</button>
            
            <div id="status" style="margin-top:1rem; text-align:center;"></div>
            <canvas id="canvas"></canvas>
            
            <div class="download-box" id="dlBox">
                <a href="#" id="dlLink" download="passport_sheet.jpg" class="dl-btn">Download HD JPG</a>
            </div>
        </section>
    </main>

    <script>
        let mainImg = new Image();
        const fileInput = document.getElementById('fileInput');
        const canvas = document.getElementById('canvas');
        const status = document.getElementById('status');
        const dlBox = document.getElementById('dlBox');
        const dlLink = document.getElementById('dlLink');

        fileInput.addEventListener('change', e => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                mainImg.src = event.target.result;
                mainImg.onload = () => {
                    status.textContent = 'Photo loaded. Ready to generate.';
                };
            };
            reader.readAsDataURL(file);
        });

        function generateSheet() {
            if (!mainImg.src) return alert('Please upload a photo first');
            
            status.textContent = 'Generating sheet...';
            const ctx = canvas.getContext('2d');
            const pw = 350, ph = 450; // Standard passport size ratio
            const copies = parseInt(document.getElementById('copies').value);
            const bgColor = document.getElementById('bgColor').value;

            const cols = 4;
            const rows = Math.ceil(copies / cols);
            const margin = 40;
            
            canvas.width = cols * (pw + margin) + margin;
            canvas.height = rows * (ph + margin) + margin;
            
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < copies; i++) {
                const x = margin + (i % cols) * (pw + margin);
                const y = margin + Math.floor(i / cols) * (ph + margin);
                
                // Draw background
                ctx.fillStyle = bgColor;
                ctx.fillRect(x, y, pw, ph);
                
                // Draw image (centered and cropped)
                const imgAr = mainImg.width / mainImg.height;
                const slotAr = pw / ph;
                let sw, sh, sx, sy;
                
                if (imgAr > slotAr) {
                    sh = mainImg.height;
                    sw = sh * slotAr;
                    sx = (mainImg.width - sw) / 2;
                    sy = 0;
                } else {
                    sw = mainImg.width;
                    sh = sw / slotAr;
                    sx = 0;
                    sy = (mainImg.height - sh) / 2;
                }
                
                ctx.drawImage(mainImg, sx, sy, sw, sh, x, y, pw, ph);
                
                // Border
                ctx.strokeStyle = '#ccc';
                ctx.lineWidth = 1;
                ctx.strokeRect(x, y, pw, ph);
            }

            canvas.style.display = 'block';
            dlBox.style.display = 'block';
            dlLink.href = canvas.toDataURL('image/jpeg', 0.9);
            status.textContent = 'Sheet generated successfully!';
        }

        // Test compatibility
        function createPassportSheet() { generateSheet(); }
    </script>
    <div id="footer"></div>
    <script>
        fetch("./footer.html").then(res => res.text()).then(data => document.getElementById("footer").innerHTML = data);
    </script>
</body>
</html>
